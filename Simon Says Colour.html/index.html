<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Colour</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div id="menu-screen">
        <h1>SIMON SAYS COLOUR</h1>
        <button id="play-button">PLAY</button>
    </div>

    <div id="game-screen" style="display: none;">
        <div id="level-display">Level 1</div>
        <div id="instruction-area">
            <h2 id="game-instruction"></h2>
            <p id="timer-display"></p>
        </div>
        
        <div id="options-area">
            <button class="color-button" id="red-button">RED</button>
            <button class="color-button" id="yellow-button">YELLOW</button>
            <button class="color-button" id="blue-button">BLUE</button>
            <button class="color-button" id="green-button">GREEN</button>
        </div>
    </div>

    <div id="gameover-overlay" style="display: none;">
        <h1>GAME OVER</h1>
        <p id="reason-display"></p> <button id="retry-button">RETRY</button>
    </div>

    <script src="script.js"></script> 
</body>
</html>
